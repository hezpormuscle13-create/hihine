name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chi can upload file DeskPet.zip vao repo: workflow tu giai nen va build.
      - name: Tim thu muc project
        id: proj
        run: |
          set -e
          # giai nen cac file zip (uu tien DeskPet*.zip) neu chua co project o thu muc goc
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ZIPS=$(find . -maxdepth 3 -iname "*deskpet*.zip" -not -path "./.git/*")
            if [ -z "$ZIPS" ]; then ZIPS=$(find . -maxdepth 3 -iname "*.zip" -not -path "./.git/*"); fi
            echo "$ZIPS" | while IFS= read -r z; do
              [ -n "$z" ] || continue
              echo "Giai nen: $z"
              unzip -o -q "$z" -d "extracted_$(basename "$z" .zip | tr ' ' '_')" || true
            done
          fi
          # chon project co ma nguon DeskPet, neu khong co thi lay project dau tien
          DIR=""
          FIRST=""
          while IFS= read -r f; do
            d=$(dirname "$f")
            [ -z "$FIRST" ] && FIRST="$d"
            if [ -f "$d/app/src/main/java/com/deskpet/app/PetView.kt" ]; then DIR="$d"; break; fi
          done < <(find . -maxdepth 5 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path "./.git/*")
          [ -z "$DIR" ] && DIR="$FIRST"
          if [ -z "$DIR" ]; then
            echo "KHONG THAY project. Hay upload file DeskPet.zip vao repo (Add file > Upload files). Cac file hien co:"
            find . -not -path "./.git/*" | head -60
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project o: $DIR"

      - name: Chap nhan license Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DeskPet-APK
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
